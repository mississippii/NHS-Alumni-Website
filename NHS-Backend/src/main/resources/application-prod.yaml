# Server at 10.10.10.16 (the default profile). Start with: java -jar NHS-Bkend-0.0.1-SNAPSHOT.jar
server:
  address: 10.10.10.16
  port: 8081

eureka:
  instance:
    prefer-ip-address: true
    ip-address: 10.10.10.16
    instance-id: 10.10.10.16:${spring.application.name}:${server.port}
  client:
    enabled: true
    register-with-eureka: true
    fetch-registry: false   # nothing here calls other services
    service-url:
      defaultZone: ${EUREKA_URL:http://admin:admin@10.10.10.16:8761/eureka}

