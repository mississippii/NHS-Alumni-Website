spring:
  application:
    name: NHS-Bkend
  # Server-only secrets (admin password hash, …), next to the jar's working directory and kept out of git.
  config:
    import: optional:file:./secrets.yaml
  profiles:
    # Runs as the server (10.10.10.16:8081 + Eureka, see application-prod.yaml) unless told otherwise.
    # On another computer: --spring.profiles.active=local  (127.0.0.1:8081, no Eureka)
    default: prod
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/NHS_Alumni}
    username: ${DB_USER:veer}
    password: ${DB_PASSWORD:Takay1#$ane}
  jpa:
    # ponytail: Hibernate manages the schema; move to Flyway migrations once it stops changing.
    hibernate:
      ddl-auto: update
    open-in-view: false
  web:
    error:
      include-message: always   # so a rejected upload says why
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

server:
  port: ${PORT:8081}   # 8100 is the Sopsy gateway on this machine
  # Only this computer can reach the API; phones go through the website (Vite forwards /api).
  address: ${BIND_ADDRESS:127.0.0.1}

nhs:
  # Admin login for /admin (set in secrets.yaml): admin-email, and admin-password-hash (see AdminController.passwordMatches).
  admin-email: ${ADMIN_EMAIL:}
  admin-password-hash: ${ADMIN_PASSWORD_HASH:}
  # Optional fixed X-Admin-Token for scripts (curl). Empty = only logged-in admins get in.
  admin-token: ${ADMIN_TOKEN:}

# Local runs don't use Eureka; the prod profile (application-prod.yaml) turns it on.
eureka:
  client:
    enabled: ${EUREKA_ENABLED:false}
